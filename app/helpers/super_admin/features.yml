# TODO: Move this values to features.yml itself
# No need to replicate the same values in two places

# ------- Premium Features ------- #
saml:
  name: 'SAML SSO'
  description: 'Configuração para controlar a disponibilidade do SAML Single Sign-On'
  enabled: <%= ChatwootApp.enterprise? %>
  icon: 'icon-lock-line'
  config_key: 'saml'
  enterprise: true
custom_branding:
  name: 'Marca Personalizada'
  description: 'Aplique sua própria marca a esta instalação.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-paint-brush-line'
  config_key: 'custom_branding'
  enterprise: true
agent_capacity:
  name: 'Capacidade do Agente'
  description: 'Defina limites para a atribuição automática de conversas aos seus agentes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-hourglass-line'
  enterprise: true
audit_logs:
  name: 'Logs de Auditoria'
  description: 'Acompanhe e rastreie as atividades da conta com facilidade por meio de logs de auditoria detalhados.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-menu-search-line'
  enterprise: true
disable_branding:
  name: 'Desabilitar Marca'
  description: 'Desabilite a marca no widget de chat ao vivo e nos e-mails externos.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-sailbot-fill'
  enterprise: true
voice_calls:
  name: 'Chamadas de Voz'
  description: 'Habilite recursos de chamada de voz para seus agentes e clientes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-voice-line'
  enterprise: true

# ------- Product Features ------- #
help_center:
  name: 'Central de Ajuda'
  description: 'Permita que os agentes criem artigos da central de ajuda e os publiquem em um portal.'
  enabled: true
  icon: 'icon-book-2-line'
captain:
  name: 'Captain'
  description: 'Habilite conversas com inteligência artificial com seus clientes.'
  enabled: true
  icon: 'icon-captain'
  config_key: 'captain'

# ------- Communication Channels ------- #
live_chat:
  name: 'Chat ao Vivo'
  description: 'Melhore a experiência do seu cliente usando um chat ao vivo no seu site.'
  enabled: true
  icon: 'icon-chat-smile-3-line'
email:
  name: 'E-mail'
  description: 'Gerencie as interações com seus clientes por e-mail a partir do Chatwoot.'
  enabled: true
  icon: 'icon-mail-send-fill'
  config_key: 'email'
sms:
  name: 'SMS'
  description: 'Gerencie as interações com seus clientes por SMS a partir do Chatwoot.'
  enabled: true
  icon: 'icon-message-line'
messenger:
  name: 'Messenger'
  description: 'Fique conectado com seus clientes no Facebook e Instagram.'
  enabled: true
  icon: 'icon-messenger-line'
  config_key: 'facebook'
instagram:
  name: 'Instagram'
  description: 'Fique conectado com seus clientes no Instagram'
  enabled: true
  icon: 'icon-instagram'
  config_key: 'instagram'
tiktok:
  name: 'TikTok'
  description: 'Fique conectado com seus clientes no TikTok'
  enabled: true
  icon: 'icon-tiktok'
  config_key: 'tiktok'
whatsapp:
  name: 'WhatsApp'
  description: 'Gerencie as interações do seu WhatsApp Business a partir do Chatwoot.'
  enabled: true
  icon: 'icon-whatsapp-line'
telegram:
  name: 'Telegram'
  description: 'Gerencie as interações com seus clientes pelo Telegram a partir do Chatwoot.'
  enabled: true
  icon: 'icon-telegram-line'
line:
  name: 'Line'
  description: 'Gerencie as interações com seus clientes pelo Line a partir do Chatwoot.'
  enabled: true
  icon: 'icon-line-line'

# ------- OAuth & Authentication ------- #
google:
  name: 'Google'
  description: 'Configuração para configurar a integração OAuth do Google'
  enabled: true
  icon: 'icon-google'
  config_key: 'google'
microsoft:
  name: 'Microsoft'
  description: 'Configuração para configurar o e-mail Microsoft'
  enabled: true
  icon: 'icon-microsoft'
  config_key: 'microsoft'

# ------- Third-party Integrations ------- #
linear:
  name: 'Linear'
  description: 'Configuração para configurar a integração com o Linear'
  enabled: true
  icon: 'icon-linear'
  config_key: 'linear'
notion:
  name: 'Notion'
  description: 'Configuração para configurar a integração com o Notion'
  enabled: true
  icon: 'icon-notion'
  config_key: 'notion'
slack:
  name: 'Slack'
  description: 'Configuração para configurar a integração com o Slack'
  enabled: true
  icon: 'icon-slack'
  config_key: 'slack'
whatsapp_embedded:
  name: 'WhatsApp Embedded'
  description: 'Configuração para configurar a integração com o WhatsApp Embedded'
