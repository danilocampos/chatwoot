# pt-BR strings for the Super Admin console (Administrate gem + Kaminari pagination),
# keyed under pt_BR (underscore) to match this app's locale convention rather than the
# gem's own "pt-BR" (hyphen) locale file, so it merges into the same I18n namespace as
# everything else instead of requiring a separate fallback chain.
#
# The administrate.* block below is adapted from the gem's own official translation at
# administrate-0.20.1/config/locales/administrate.pt-BR.yml.
pt_BR:
  administrate:
    actions:
      confirm: Você tem certeza?
      destroy: Deletar
      edit: Editar
      edit_resource: "Editar %{name}"
      show_resource: "Visualizar %{name}"
      new_resource: "Criar %{name}"
      back: Voltar
    controller:
      create:
        success: "%{resource} foi criado com sucesso."
      destroy:
        success: "%{resource} foi deletado com sucesso."
      update:
        success: "%{resource} foi atualizado com sucesso."
    fields:
      has_many:
        more: "Exibindo %{count} de %{total_count}"
        none: Nenhum
    form:
      error: erro
      errors: "%{pluralized_errors} impediram %{resource_name} de ser gravado:"
    navigation:
      back_to_app: Voltar ao aplicativo
    search:
      clear: Limpar pesquisa
      label: "Pesquisar %{resource}"
  views:
    pagination:
      first: "&laquo; Primeira"
      last: "Última &raquo;"
      previous: "&lsaquo; Anterior"
      next: "Próxima &rsaquo;"
      truncate: "&hellip;"
  helpers:
    page_entries_info:
      entry:
        zero: itens
        one: item
        other: itens
      one_page:
        display_entries:
          zero: "Nenhum %{entry_name} encontrado"
          one: "Exibindo <b>1</b> %{entry_name}"
          other: "Exibindo <b>todos os %{count}</b> %{entry_name}"
      more_pages:
        display_entries: "Exibindo %{entry_name} <b>%{first}&nbsp;-&nbsp;%{last}</b> de <b>%{total}</b> no total"
